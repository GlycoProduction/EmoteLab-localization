name: Update contributors

on:
  push:
    branches: [main]
    paths:
      - "**/Main Menu String Table_*.csv"
      - "**/CoffeeBean/**"
      - "scripts/generate_contributors.py"
      - "contributors.config.json"
      - ".github/workflows/update-contributors.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contributors section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_contributors.py

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-contributors
          delete-branch: true
          add-paths: README.md
          commit-message: "chore: update contributors section [skip ci]"
          title: "chore: update contributors section"
          body: |
            Regenerates the README contributors table from recent translation commits.

            Auto-generated by the Update contributors workflow.
